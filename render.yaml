# Render Blueprint for the FaceVault backend (Flask API), FREE plan.
# Render dashboard -> New -> Blueprint -> pick this repository.
#
# Free plan has no persistent disk, so all state lives in Supabase (PostgreSQL): the encrypted face
# templates, the audit log, the encrypted keyring and the encrypted RSA transport key. Nothing that
# matters is written to the server's disk.
#
# The frontend is on Vercel (frontend/vercel.json forwards /api/* here). If Render gives this service a
# different URL than https://biometric-face-image-encryption.onrender.com, update the rewrite in frontend/vercel.json.
services:
  - type: web
    name: facevault-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Exactly one worker: the replay cache and rate limits live in process memory.
    startCommand: gunicorn -w 1 --threads 8 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Supabase -> Connect -> "Session pooler" connection string (IPv4), with your database password
      # filled in. Entered in the dashboard, never stored in git.
      - key: DATABASE_URL
        sync: false
      # Strong random passphrase generated by Render. It encrypts the keyring stored in Supabase.
      # Never change it without running change_passphrase.py first, or the keyring stays locked.
      - key: BFE_MASTER_PASSPHRASE
        generateValue: true
      - key: BFE_SUPER_ADMIN
        sync: false
      - key: BFE_ADMIN_PASSWORD
        sync: false
      # Browser -> Vercel -> Render: two proxies append to X-Forwarded-For.
      - key: BFE_TRUSTED_PROXIES
        value: "2"
      - key: BFE_MATCH_THRESHOLD
        value: "0.5"
      - key: BFE_JWT_TTL_MINUTES
        value: "30"
