# Render Blueprint for the FaceVault backend (Flask API).
# Render dashboard -> New -> Blueprint -> pick this repository.
#
# The frontend is deployed separately on Vercel (see frontend/vercel.json), which forwards /api/* here.
# If Render gives this service a different URL than https://facevault-api.onrender.com, update the
# rewrite destination in frontend/vercel.json to match.
services:
  - type: web
    name: facevault-api
    runtime: python
    rootDir: backend
    # A persistent disk needs a paid instance type; the free type wipes the database on every restart.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Exactly one worker: keys, replay cache and rate limits live in process memory.
    startCommand: gunicorn -w 1 --threads 8 --timeout 60 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: facevault-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BFE_DATA_DIR
        value: /var/data
      # Strong random passphrase generated by Render on first deploy. Never change it in the dashboard
      # without running change_passphrase.py first, or the keyring can no longer be unlocked.
      - key: BFE_MASTER_PASSPHRASE
        generateValue: true
      # Entered in the dashboard when the Blueprint is created (not stored in git).
      - key: BFE_SUPER_ADMIN
        sync: false
      - key: BFE_ADMIN_PASSWORD
        sync: false
      # Browser -> Vercel -> Render: two proxies append to X-Forwarded-For.
      - key: BFE_TRUSTED_PROXIES
        value: "2"
      - key: BFE_MATCH_THRESHOLD
        value: "0.5"
      - key: BFE_JWT_TTL_MINUTES
        value: "30"
